# Configuration Prometheus - Workflow Furious Ducks
# Collecte les metriques des briques du workflow ainsi que des environnements applicatifs geres.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "jenkins"
    metrics_path: /prometheus
    static_configs:
      - targets: ["jenkins:8080"]

  - job_name: "gitea"
    metrics_path: /metrics
    static_configs:
      - targets: ["gitea:3000"]

  - job_name: "registry"
    static_configs:
      - targets: ["registry:5000"]

  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8080"]

  # Exporters a deployer sur chaque hote applicatif (node_exporter / cadvisor)
  - job_name: "app-dev"
    static_configs:
      - targets: ["app-dev-exporter:9100"]
        labels:
          environnement: "dev"

  - job_name: "app-preprod"
    static_configs:
      - targets: ["app-preprod-exporter:9100"]
        labels:
          environnement: "preprod"

  - job_name: "app-prod"
    static_configs:
      - targets: ["app-prod-exporter:9100"]
        labels:
          environnement: "prod"
