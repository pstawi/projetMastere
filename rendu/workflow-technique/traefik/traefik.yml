# Configuration statique Traefik (alternative fichier a la configuration par arguments CLI
# deja presente dans docker-compose.yml). A utiliser si vous preferez monter ce fichier
# dans /etc/traefik/traefik.yml plutot que de passer des "command:" dans le compose.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "contact@wk-<classe>-<groupe>.fr"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}
